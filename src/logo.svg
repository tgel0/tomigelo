<svg width="256" height="256" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- This is the white background rectangle. -->
  <rect width="100" height="100" fill="white"/>
  
  <!-- 
    This is the text element for the letter 'S'.
    - x="50%" and y="50%" position the anchor point at the center.
    - dominant-baseline="middle" and text-anchor="middle" ensure the letter itself is visually centered.
    - The font-family is set to 'Inter' with a generic sans-serif fallback.
    - font-weight="600" gives it a semi-bold look, similar to the landing page.
  -->
  <text 
    x="50%" 
    y="50%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="Inter, 'Helvetica Neue', sans-serif" 
    font-size="80" 
    font-weight="600" 
    fill="black">
    S
  </text>
</svg>