<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#111111">
    <meta name="robots" content="noindex">
    <title>404 — Page not found · Tomi Gelo</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 40px 20px;
            color: #f4efe8;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            line-height: 1.6;
            text-align: center;
            background:
                radial-gradient(circle at top left, rgba(215, 165, 107, 0.1), transparent 24%),
                linear-gradient(180deg, #171717 0%, #111111 50%, #0a0a0a 100%);
        }
        .panel {
            max-width: 460px;
            padding: 36px 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(28, 28, 28, 0.96), rgba(19, 19, 19, 0.96));
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22);
        }
        .code {
            margin: 0 0 12px;
            color: #d7a56b;
            font-weight: 700;
            letter-spacing: 0.12em;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 2rem;
            font-weight: 650;
            letter-spacing: -0.04em;
            line-height: 1.05;
        }
        p { margin: 0 0 24px; color: #b1a79a; }
        a {
            display: inline-block;
            padding: 12px 22px;
            border: 1px solid rgba(215, 165, 107, 0.5);
            border-radius: 10px;
            color: #d7a56b;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease;
        }
        a:hover { background: rgba(215, 165, 107, 0.12); }
        a:focus-visible { outline: 2px solid #d7a56b; outline-offset: 3px; }
        @media (prefers-reduced-motion: reduce) {
            a { transition: none; }
        }
    </style>
</head>
<body>
    <div class="panel">
        <p class="code">404</p>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or may have moved.</p>
        <a href="/">Back to tomigelo.com</a>
    </div>
</body>
</html>
