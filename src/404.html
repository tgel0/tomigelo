<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#080a10">
    <meta name="robots" content="noindex">
    <title>404 — Red Card / Offside · Tomi Gelo FC</title>
    <style>
        :root {
            color-scheme: dark;
            --bg-pitch: #080a10;
            --bg-top: #0c0f18;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --neon-cyan: #00f5ff;
            --neon-cyan-glow: rgba(0, 245, 255, 0.28);
            --neon-red: #ef4444;
            --neon-red-glow: rgba(239, 68, 68, 0.3);
            --rule-cyber: rgba(0, 245, 255, 0.18);
            --font-display: "DIN Alternate", "Franklin Gothic Medium", "Arial Narrow", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --font-mono: "SFMono-Regular", "SF Mono", "Menlo", "Consolas", monospace;
            --cut-corner-md: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
            --cut-corner-sm: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 40px 20px;
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background:
                radial-gradient(ellipse 80% 40% at 50% -5%, rgba(239, 68, 68, 0.15), transparent 70%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-pitch) 100%);
            text-align: center;
        }
        .panel {
            max-width: 480px;
            width: 100%;
            padding: 40px 32px;
            background: linear-gradient(175deg, #131929 0%, #0d121f 60%, #090c13 100%);
            border: 1px solid var(--neon-red);
            clip-path: var(--cut-corner-md);
            box-shadow: 0 0 30px var(--neon-red-glow), 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .ref-card {
            width: 40px;
            height: 56px;
            background: var(--neon-red);
            border-radius: 4px;
            box-shadow: 0 0 16px var(--neon-red-glow);
            margin-bottom: 6px;
        }
        .code {
            margin: 0;
            color: var(--neon-red);
            font-family: var(--font-mono);
            font-weight: 800;
            letter-spacing: 0.15em;
            font-size: 0.82rem;
            text-transform: uppercase;
        }
        h1 {
            margin: 0;
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            line-height: 1.1;
        }
        p {
            margin: 0 0 12px;
            color: var(--text-secondary);
            font-size: 0.94rem;
            line-height: 1.5;
        }
        a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 12px 24px;
            background: var(--neon-cyan);
            color: var(--bg-pitch);
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            clip-path: var(--cut-corner-sm);
            box-shadow: 0 0 16px var(--neon-cyan-glow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 24px var(--neon-cyan-glow);
        }
        a:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="ref-card" aria-hidden="true"></div>
        <p class="code">VAR DECISION // 404</p>
        <h1>Play Disallowed</h1>
        <p>The tactical coordinate or page you requested is offside or does not exist on this squad roster.</p>
        <a href="/">Return to Tactical Hub ↗</a>
    </div>
</body>
</html>
